<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ワンタイムパスワード入力 - ip3-hackathon</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        background: #fff;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 360px;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
        text-align: center;
      }
      p.desc {
        margin: 0 0 1.5rem;
        font-size: 0.85rem;
        color: #555;
        text-align: center;
      }
      .status {
        margin: 0 0 1rem;
        padding: 0.65rem;
        border-radius: 6px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 0.85rem;
        text-align: center;
      }
      .status.failed {
        background: #fef2f2;
        color: #dc2626;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.3rem;
        color: #333;
      }
      input {
        width: 100%;
        padding: 0.6rem 0.7rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1.3rem;
        letter-spacing: 0.3em;
        text-align: center;
      }
      button {
        width: 100%;
        padding: 0.7rem;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        background: #93b4f0;
        cursor: not-allowed;
      }
      .error {
        color: #dc2626;
        font-size: 0.85rem;
        margin: -0.5rem 0 1rem;
        min-height: 1.1em;
      }
      .back {
        display: block;
        margin-top: 1.2rem;
        font-size: 0.8rem;
        text-align: center;
        color: #2563eb;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ワンタイムパスワード入力</h1>
      <p class="desc">SMSの配信状況を確認しています</p>
      <p class="status" id="delivery-status">SMS送信リクエストを受け付けました</p>
      <form id="otp-form">
        <label for="code">ワンタイムパスワード</label>
        <input
          type="text"
          id="code"
          name="code"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          required
        />

        <p class="error" id="error"></p>

        <button type="submit" id="submit-btn">ログイン</button>
      </form>
      <a class="back" href="index.html">ログイン画面に戻る</a>
    </div>

    <script>
      const challengeId = sessionStorage.getItem("otp_challenge_id");
      if (!challengeId) {
        window.location.href = "index.html";
      }

      const form = document.getElementById("otp-form");
      const errorEl = document.getElementById("error");
      const submitBtn = document.getElementById("submit-btn");
      const codeInput = document.getElementById("code");
      const deliveryStatusEl = document.getElementById("delivery-status");
      let statusTimer;

      codeInput.disabled = true;
      submitBtn.disabled = true;

      async function checkDeliveryStatus() {
        try {
          const res = await fetch(`/api/auth/otp/${encodeURIComponent(challengeId)}/status`);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.detail || "SMSの配信状況を確認できませんでした");
          }

          deliveryStatusEl.textContent = data.message;
          deliveryStatusEl.classList.toggle("failed", data.delivery_status === "failed");

          if (data.delivery_status === "delivered") {
            codeInput.disabled = false;
            submitBtn.disabled = false;
            codeInput.focus();
            return;
          }

          if (data.delivery_status === "failed") {
            codeInput.disabled = true;
            submitBtn.disabled = true;
            return;
          }
        } catch (err) {
          deliveryStatusEl.textContent = err.message;
        }

        statusTimer = window.setTimeout(checkDeliveryStatus, 5000);
      }

      checkDeliveryStatus();
      window.addEventListener("beforeunload", () => window.clearTimeout(statusTimer));

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.textContent = "";
        submitBtn.disabled = true;

        const code = codeInput.value;

        try {
          const res = await fetch("/api/auth/otp/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ challenge_id: challengeId, code }),
          });

          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || "ワンタイムパスワードの検証に失敗しました");
          }

          const data = await res.json();
          sessionStorage.removeItem("otp_challenge_id");
          localStorage.setItem("access_token", data.access_token);
          window.location.href = "welcome.html";
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
